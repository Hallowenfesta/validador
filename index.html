<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Validador de Ingressos</title>

  <!-- Biblioteca para leitura de QR Code -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 450px;
      margin: 20px auto;
      background: white;
      padding: 25px 20px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
    }

    h1 {
      margin-top: 0;

    }

    .instrucao {
      color: #555;

      width: 100%;

      border-radius: 15px;

    }

      width: 100%;

      cursor: pointer;
    }

    .popup-caixa.utilizado,
    .popup-caixa.invalido {

      background: #2563eb;
      color: white;
      margin-top: 10px;
    }

  </style>

</head>


<body>


<div class="container">

  <h1>🎟️ Validar Convite</h1>

  <p class="instrucao">
    Aponte a câmera para o QR Code do ingresso.
  </p>


  <!-- Leitor da câmera -->
  <div id="reader"></div>


  <p>Ou digite o código:</p>


  <input
    id="codigo"
    maxlength="6"
    autocomplete="off"
    placeholder="ABC123">


  <button
    id="botaoValidar"
    onclick="validarDigitado()">

    VALIDAR CÓDIGO

  </button>


  <div id="resultado"></div>

</div>



<!-- ==================================================
     POPUP DO RESULTADO
     ================================================== -->

<div id="popup">

  <div id="popupCaixa"
       class="popup-caixa">

    <div id="popupIcone"
         class="popup-icone">
    </div>


    <div id="popupTitulo"
         class="popup-titulo">
    </div>


    <div id="popupNome"
         class="popup-nome">
    </div>


    <button
      class="botao-proximo"
      onclick="proximoIngresso()">

      PRÓXIMO INGRESSO

    </button>

  </div>

</div>



<script>


/* ==================================================
   CONFIGURAÇÃO
   ================================================== */

const URL_APPS_SCRIPT =
  "https://script.google.com/macros/s/AKfycby15Iu1jTxjPSeoSbAcoCV7iLIb8Wl3t5pttRWnuOrYo6N5T-mIKkre99JrjjiSNFh3/exec";


let leitor = null;

let cameraLigada = false;

let processando = false;

let contadorCallback = 0;



/* ==================================================
   MOSTRAR POPUP
   ================================================== */

function mostrarPopup(tipo, nome) {

  const popup =
    document.getElementById("popup");

  const caixa =
    document.getElementById("popupCaixa");

  const icone =
    document.getElementById("popupIcone");

  const titulo =
    document.getElementById("popupTitulo");

  const nomeElemento =
    document.getElementById("popupNome");


  caixa.className =
    "popup-caixa " + tipo;


  if (tipo === "valido") {

    icone.innerHTML = "✅";

    titulo.innerHTML =
      "CÓDIGO VÁLIDO";

    nomeElemento.innerHTML =
      nome || "";

  }


  else if (tipo === "utilizado") {

    icone.innerHTML = "⚠️";

    titulo.innerHTML =
      "JÁ UTILIZADO";

    nomeElemento.innerHTML =
      nome || "";

  }


  else {

    icone.innerHTML = "❌";

    titulo.innerHTML =
      "CÓDIGO INVÁLIDO";

    nomeElemento.innerHTML =
      "";

  }


  popup.style.display =
    "flex";
}



/* ==================================================
   FECHAR POPUP E LIGAR CÂMERA NOVAMENTE
   ================================================== */

async function proximoIngresso() {

  document.getElementById("popup")
    .style.display = "none";


  document.getElementById("codigo")
    .value = "";


  document.getElementById("resultado")
    .innerHTML = "";


  processando = false;


  await iniciarLeitor();
}



/* ==================================================
   QUANDO O QR CODE FOR LIDO
   ================================================== */

async function qrCodeLido(codigo) {

  /*
   * Impede que o mesmo QR seja
   * processado várias vezes.
   */

  if (processando) {
    return;
  }


  processando = true;


  /*
   * Coloca o código no campo.
   */

  document.getElementById("codigo")
    .value = codigo;


  /*
   * PARA A CÂMERA IMEDIATAMENTE.
   *
   * Assim o QR não fica sendo
   * lido várias vezes.
   */

  await pararLeitor();


  /*
   * Agora consulta o sistema.
   */

  validarCodigo(codigo);
}



/* ==================================================
   PARAR CÂMERA
   ================================================== */

async function pararLeitor() {

  if (!leitor || !cameraLigada) {
    return;
  }


  try {

    await leitor.stop();

  }

  catch (erro) {

    console.log(
      "Erro ao parar câmera:",
      erro
    );

  }


  cameraLigada = false;
}



/* ==================================================
   VALIDAÇÃO
   ================================================== */

function validarCodigo(codigo) {

  const resultado =
    document.getElementById("resultado");


  codigo =
    String(codigo)
      .trim()
      .toUpperCase();


  if (!codigo) {

    resultado.className =
      "resultado invalido";

    resultado.innerHTML =
      "Digite um código.";

    processando = false;

    return;
  }


  resultado.className =
    "resultado";

  resultado.innerHTML =
    "🔎 Consultando...";


  /*
   * Cria um nome exclusivo para
   * a função de retorno.
   */

  contadorCallback++;


  const nomeCallback =
    "resultadoQR_" + contadorCallback;


  /*
   * Função que receberá a resposta
   * do Google Apps Script.
   */

  window[nomeCallback] =
    function(resposta) {


      /*
       * CÓDIGO VÁLIDO
       */

      if (resposta.status === "valido") {

        resultado.className =
          "resultado valido";

        resultado.innerHTML =
          "✅ CÓDIGO VÁLIDO" +
          '<div class="nome">' +
          (resposta.nome || "") +
          "</div>";


        mostrarPopup(
          "valido",
          resposta.nome
        );

      }


      /*
       * JÁ UTILIZADO
       */

      else if (
        resposta.status === "utilizado"
      ) {

        resultado.className =
          "resultado utilizado";

        resultado.innerHTML =
          "⚠️ CÓDIGO JÁ UTILIZADO" +
          '<div class="nome">' +
          (resposta.nome || "") +
          "</div>";


        mostrarPopup(
          "utilizado",
          resposta.nome
        );

      }


      /*
       * INVÁLIDO
       */

      else {

        resultado.className =
          "resultado invalido";

        resultado.innerHTML =
          "❌ CÓDIGO INVÁLIDO";


        mostrarPopup(
          "invalido",
          ""
        );

      }


      /*
       * Remove a função temporária.
       */

      delete window[nomeCallback];


      if (script.parentNode) {

        script.parentNode
          .removeChild(script);

      }

    };


  /*
   * Cria a chamada para o Apps Script.
   */

  const script =
    document.createElement("script");


  script.src =
    URL_APPS_SCRIPT +
    "?acao=validar" +
    "&codigo=" +
    encodeURIComponent(codigo) +
    "&callback=" +
    nomeCallback +
    "&t=" +
    Date.now();


  /*
   * Se o celular não conseguir
   * carregar a resposta.
   */

  script.onerror =
    function() {

      resultado.className =
        "resultado invalido";

      resultado.innerHTML =
        "❌ Erro ao consultar o sistema.";


      /*
       * Mostra também o erro
       * de forma grande.
       */

      mostrarPopup(
        "invalido",
        "Erro ao consultar o sistema"
      );


      processando = false;


      delete window[nomeCallback];


      if (script.parentNode) {

        script.parentNode
          .removeChild(script);

      }

    };


  /*
   * Envia a solicitação.
   */

  document.body.appendChild(script);

}



/* ==================================================
   VALIDAÇÃO DIGITADA
   ================================================== */

async function validarDigitado() {

  if (processando) {
    return;
  }


  const campo =
    document.getElementById("codigo");


  const codigo =
    campo.value
      .trim()
      .toUpperCase();


  if (!codigo) {

    mostrarPopup(
      "invalido",
      "Digite um código."
    );

    return;
  }


  processando = true;


  /*
   * Se a câmera estiver ligada,
   * para antes da validação.
   */

  await pararLeitor();


  validarCodigo(codigo);

}



/* ==================================================
   INICIAR LEITOR
   ================================================== */

async function iniciarLeitor() {

  /*
   * Se já estiver funcionando,
   * não cria outro leitor.
   */

  if (cameraLigada) {
    return;
  }


  const elemento =
    document.getElementById("reader");


  elemento.innerHTML = "";


  leitor =
    new Html5Qrcode("reader");


  const configuracao = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    },

    aspectRatio: 1.0

  };


  try {

    await leitor.start(

      {
        facingMode: "environment"
      },

      configuracao,


      function(codigoLido) {

        qrCodeLido(codigoLido);

      },


      function(erro) {

        /*
         * Erros normais de leitura
         * são ignorados.
         */

      }

    );


    cameraLigada = true;

  }


  catch (erro) {

    console.log(
      "Erro ao iniciar câmera:",
      erro
    );


    const resultado =
      document.getElementById("resultado");


    resultado.className =
      "resultado invalido";


    resultado.innerHTML =
      "❌ Não foi possível acessar a câmera.";

  }

}



/* ==================================================
   INICIAR QUANDO A PÁGINA CARREGAR
   ================================================== */

window.onload =
  function() {

    iniciarLeitor();

  };


</script>


</body>

</html>
