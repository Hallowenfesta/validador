<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b090e">
  <meta name="robots" content="noindex, nofollow">
  <title>Portaria · Noite do Horror</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/validador.css">
</head>
<body>
  <main class="pagina">
    <header class="cabecalho surgir">
      <p class="sobretitulo">Portaria</p>
      <h1>Noite do Horror</h1>
    </header>

    <!-- 1) Login: só quem tem a chave da portaria valida ingressos. -->
    <section class="cartao surgir" style="--i: 1" id="tela-login" hidden>
      <div class="medalhao">
        <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>
      </div>
      <h2 class="centro">Acesso da equipe</h2>
      <form id="form-login" novalidate>
        <div class="campo">
          <label for="chave">Chave da portaria</label>
          <input id="chave" type="password" autocomplete="current-password"
                 autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX"
                 aria-describedby="erro-login">
          <div class="erro-campo" id="erro-login" role="alert"></div>
        </div>
        <button type="submit" class="botao" id="botao-entrar">Entrar</button>
      </form>
      <p class="nota">Peça a chave para a organização do evento.</p>
    </section>

    <!-- 2) Tela de trabalho. -->
    <section id="tela-validacao" hidden>
      <div class="cartao surgir" style="--i: 1">
        <!-- Visor: antes da câmera ligar mostra os cantos de enquadramento;
             depois, o vídeo aparece dentro dele. -->
        <div class="visor" id="visor">
          <div id="leitor" class="leitor" aria-label="Visualização da câmera"></div>
          <div class="visor-cantos" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          <div class="visor-vazio" id="visor-vazio">
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8.5A1.5 1.5 0 0 1 5 7h2.2l1.4-2h6.8l1.4 2H19a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19 19H5a1.5 1.5 0 0 1-1.5-1.5z"/><circle cx="12" cy="12.5" r="3.5"/></svg>
            <span>Câmera desligada</span>
          </div>
        </div>

        <button type="button" class="botao" id="botao-camera"></button>

        <div class="separador-texto"><span>ou digite o código</span></div>

        <form id="form-codigo" class="form-codigo" novalidate>
          <label for="codigo" class="so-leitor">Código do ingresso</label>
          <input id="codigo" type="text" autocomplete="off" autocapitalize="characters"
                 spellcheck="false" placeholder="Código" maxlength="20">
          <button type="submit" class="botao botao-secundario" id="botao-validar">Validar</button>
        </form>
      </div>

      <div class="rodape-portaria surgir" style="--i: 2">
        <p class="status" id="status" aria-live="polite">Ative a câmera ou digite um código.</p>
        <p class="contador" id="contador" hidden></p>
        <button type="button" class="botao-texto botao-texto-neutro" id="botao-sair">Sair deste aparelho</button>
      </div>
    </section>
  </main>

  <!-- 3) Resultado em tela cheia: cor + ícone + texto, legível de longe. -->
  <div id="resultado" class="resultado" role="alertdialog" aria-modal="true"
       aria-labelledby="resultado-titulo" aria-describedby="resultado-detalhe" hidden>
    <div class="resultado-conteudo">
      <div class="resultado-icone" id="resultado-icone" aria-hidden="true"></div>
      <h2 class="resultado-titulo" id="resultado-titulo"></h2>
      <p class="resultado-nome" id="resultado-nome"></p>
      <p class="resultado-detalhe" id="resultado-detalhe"></p>
      <button type="button" class="botao resultado-botao" id="botao-proximo">Próximo ingresso</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"
          integrity="sha512-r6rDA7W6ZeQhvl8S7yRVQUKVHdexq+GAlNkNNqVC7YyIV+NwqCTJe2hDWCiffTyRNOeGEzRRJ9ifvRm/HCzGYg=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script type="module" src="assets/js/validador.js"></script>
</body>
</html>
