<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b090e">
  <meta name="description" content="Compra de ingressos da Noite do Horror.">
  <title>Ingressos · Noite do Horror</title>
  <!-- Inter só pra quem não tem a fonte do sistema da Apple (Android, Windows). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/vendas.css">
</head>
<body>
  <main class="pagina">
    <header class="cabecalho surgir">
      <p class="sobretitulo">Ingressos</p>
      <h1>Noite do Horror</h1>
      <p class="subtitulo">Garanta seu lugar.</p>
    </header>

    <!-- Preço e vagas vêm do backend; até chegar, aparece o esqueleto animado. -->
    <section class="cartao lote surgir" style="--i: 1" aria-live="polite" aria-busy="true" id="lote">
      <div>
        <p class="lote-nome"><span id="lote-nome" class="esqueleto">Carregando</span></p>
        <p class="vagas" id="vagas"><span class="esqueleto">00 disponíveis</span></p>
      </div>
      <p class="preco"><span id="preco" class="esqueleto">R$ 00,00</span></p>
    </section>

    <section class="cartao surgir" style="--i: 2" id="secao-formulario" hidden>
      <h2>Seus dados</h2>

      <!-- novalidate: a validação é feita no JS, com mensagens em português
           e no mesmo padrão do backend, em vez dos balões do navegador. -->
      <form id="formulario" novalidate>
        <div class="campo">
          <label for="nome">Nome completo</label>
          <input id="nome" name="nome" type="text" autocomplete="name" placeholder="Como no documento"
                 maxlength="100" aria-describedby="erro-nome" required>
          <div class="erro-campo" id="erro-nome"></div>
        </div>

        <div class="campo">
          <label for="telefone">Telefone (WhatsApp)</label>
          <input id="telefone" name="telefone" type="tel" inputmode="tel" autocomplete="tel-national"
                 placeholder="(00) 00000-0000" aria-describedby="erro-telefone" required>
          <div class="erro-campo" id="erro-telefone"></div>
        </div>

        <div class="campo">
          <label for="cpf">CPF</label>
          <input id="cpf" name="cpf" type="text" inputmode="numeric" autocomplete="off"
                 placeholder="000.000.000-00" aria-describedby="erro-cpf" required>
          <div class="erro-campo" id="erro-cpf"></div>
        </div>

        <div class="campo">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" inputmode="email" autocomplete="email"
                 placeholder="voce@email.com" aria-describedby="ajuda-email erro-email" required>
          <div class="erro-campo" id="erro-email"></div>
          <p class="ajuda-campo" id="ajuda-email">Os ingressos chegam neste e-mail.</p>
        </div>

        <div class="campo">
          <span class="rotulo" id="rotulo-quantidade">Quantidade</span>
          <!-- Controle segmentado. Os botões de rádio são criados pelo JS
               conforme o limite por compra e as vagas restantes. -->
          <div class="segmentado" id="quantidade" role="radiogroup" aria-labelledby="rotulo-quantidade">
            <span class="segmentado-indicador" aria-hidden="true"></span>
          </div>
        </div>

        <div class="resumo">
          <span>Total</span>
          <strong id="total">–</strong>
        </div>

        <button type="submit" class="botao" id="botao-comprar">
          <span class="botao-rotulo">Continuar para o pagamento</span>
          <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6.5l5.5 5.5-5.5 5.5"/></svg>
        </button>

        <div class="aviso aviso-erro" id="erro-geral" role="alert" hidden></div>

        <p class="selo-seguranca">
          <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>
          Pagamento seguro pela InfinitePay · Pix ou cartão
        </p>
      </form>
    </section>

    <div class="aviso aviso-erro" id="erro-carregar" role="alert" hidden>
      <span id="erro-carregar-texto"></span>
      <button type="button" class="botao-texto" id="tentar-novamente">Tentar novamente</button>
    </div>
  </main>

  <script type="module" src="../assets/js/vendas.js"></script>
</body>
</html>
